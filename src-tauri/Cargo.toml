[package]
name = "guitar_workstation"
version = "0.1.0"
description = "Cross-Platform Guitarist Workstation"
authors = ["Daniel"]
edition = "2021"

[lib]
name = "guitar_workstation_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
cpal = "0.15"
rtrb = "0.3"
atomic_float = "1.1"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "vorbis"] }
rubato = "0.16"
rustfft = "6.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
parking_lot = "0.12"
base64 = "0.22"
