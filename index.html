<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guitar Workstation</title>
    <style>
      :root {
        --bg-main: #121316;
        --bg-surface: #1a1c22;
        --bg-panel: #22252c;
        --bg-pedalboard: #16181d;
        --accent-orange: #ff6b35;
        --accent-amber: #f7a028;
        --accent-cyan: #00d2ff;
        --accent-green: #2ecc71;
        --accent-red: #e74c3c;
        --text-primary: #f0f2f5;
        --text-secondary: #9aa0a6;
        --text-muted: #5f6368;
        --border-color: #2e333d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
